    var sub = c.subtitle || block.body || "";
    var author = c.author || "";
    var media = c.mediaUrl || mediaUrl(block);
    var onPhoto = c.onPhoto !== false && Boolean(media);
    var showPanel = c.showTitlePanel !== false && onPhoto && layout !== "transparent";
    if (layout === "overlay" && !media) showPanel = true;
    var cardCls = "cover-card" + (showPanel ? " panel" : "");
    var cardStyle = "";
    var m = c.panelMargin || {};
    if (m.top || m.right || m.bottom || m.left) {
      cardStyle = ' style="margin-top:' + (m.top || 0) + "px;margin-right:" + (m.right || 0) +
        "px;margin-bottom:" + (m.bottom || 0) + "px;margin-left:" + (m.left || 0) + 'px"';
    }
    var card = '<div class="' + cardCls + '"' + cardStyle + "><h1>" + esc(title) + "</h1>" +
      (sub ? '<p class="cover-sub">' + esc(sub) + "</p>" : "") +
      (author ? '<p class="cover-author">' + esc(author) + "</p>" : "") + "</div>";
    var stack = '<div class="cover-stack align-' + esc(align) + '">' + card + "</div>";
    if ((layout === "split-media" || layout === "split-text") && media) {
      var pane = '<div class="cover-split-media"><div class="cover-bg" style="background-image:url(\'' + cssEsc(media) + '\')"></div></div>';
      var inner = layout === "split-media" ? pane + stack : stack + pane;
      return '<section class="cover split">' + inner + "</section>";
    }
    var bg = media
      ? '<div class="cover-bg" style="background-image:url(\'' + cssEsc(media) + '\')"></div>'
      : "";
    var scrim = "";
    if (media) {
      var g = layout === "transparent" ? (c.scrimFlat || "rgba(12,36,54,0.3)") : (c.scrimGradient || "rgba(12,36,54,0.45)");
      scrim = '<div class="cover-scrim" style="background:' + g + '"></div>';
    }
    var mapSlot = !media && c.hasMap
      ? '<div class="cover-bg sm-map" data-map-id="' + esc((block.embedRef && block.embedRef.blockId) || "") + '" data-camera="' +
        esc(JSON.stringify((block.embedRef && block.embedRef.camera) || null)) + '"></div>'
      : "";
    return '<section class="cover">' + bg + mapSlot + scrim + stack + "</section>";
  }
  function blockInner(block, board, stacked) {
    var title = titleHtml(block);
    var body = bodyHtml(block);
    var cap = capHtml(block);
    var media = mediaUrl(block);
    var pad = stacked ? "block pad-stack" : "block pad";
    if (block.kind === "separator") return '<div class="block pad"><hr class="div"/></div>';
    if (block.kind === "image" && media) {
      var center = stacked && !block.title ? " media-center" : "";
      return '<div class="' + pad + center + '">' + title + '<img class="media" src="' + esc(media) + '" alt=""/>' + cap + "</div>";
    }
    if (block.kind === "video" && media) {
      return '<div class="' + pad + '">' + title + '<video class="media" src="' + esc(media) + '" controls></video>' + cap + "</div>";
    }
    if (block.kind === "audio" && media) {
      return '<div class="' + pad + '">' + title + '<audio src="' + esc(media) + '" controls></audio>' + cap + "</div>";
    }
    if (block.kind === "map" || block.kind === "swipe" || block.kind === "sidecar" || block.kind === "map-tour" || block.kind === "timeline") {
      var mid = (block.embedRef && block.embedRef.blockId) || "";
      return '<div class="' + pad + '">' + title + '<div class="sm-map" data-map-id="' + esc(mid) + '" data-camera="' +
        esc(JSON.stringify((block.embedRef && block.embedRef.camera) || null)) + '"></div>' + cap + "</div>";
    }
    if (block.kind === "credits") {
      return '<div class="block credits" id="credits">' + title + body + "</div>";
    }
    if (block.kind === "figure") {
      var fig = (block.figure && block.figure.value) || "";
      var lab = (block.figure && block.figure.label) || "";
      return '<div class="' + pad + '" style="text-align:center"><p style="font-size:3rem;font-weight:600;font-family:var(--sm-display);margin:0;color:var(--sm-accent)">' +
        esc(fig) + "</p>" + (lab ? '<p class="cap">' + esc(lab) + "</p>" : "") + "</div>";
    }
    return '<div class="' + pad + '">' + title + body + cap + "</div>";
  }
  function renderStory(root, payload) {
    var doc = payload.document || {};
    var board = payload.board || {};
    var chrome = payload.chrome || {};
    var vars = chrome.vars || payload.theme || {};
    var blocks = doc.blocks || [];
    var byId = {};
    blocks.forEach(function (b) { byId[b.id] = b; });
    var rows = chrome.rows;
    if (!rows || !rows.length) {
      rows = blocks.map(function (b) {
        return { fullBleed: b.kind === "introduction" || b.kind === "sidecar" || b.kind === "map-tour" || b.kind === "swipe" || b.kind === "timeline" || b.width === "full", ids: [b.id] };
      });
    }
    var style = [
      "--sm-ink:" + (vars.ink || "#15202b"),
      "--sm-bg:" + (vars.bg || "#f3f5f7"),
      "--sm-muted:" + (vars.muted || "#5b6b7c"),
      "--sm-accent:" + (vars.accent || "#1b4f72"),
      "--sm-cover-panel:" + (vars.coverPanel || "#123a54"),
      "--sm-cover-text:" + (vars.coverText || "#fff"),
      "--sm-cover-muted:" + (vars.coverMuted || "rgba(245,247,250,0.9)"),
      "--sm-cover-scrim:" + (vars.coverScrim || "#0c2436"),
      "--sm-display:" + (vars.displayFont || 'Georgia, "Times New Roman", serif'),
      "--sm-body:" + (vars.bodyFont || 'var(--font-inter), "Inter", "Segoe UI", system-ui, sans-serif'),
      "--sm-heading-size:" + (vars.headingSize || "15pt"),
      "--sm-body-size:" + (vars.bodySize || "12pt"),
      "--sm-panel-fill:" + ((chrome.cover && chrome.cover.panelFill) || "rgba(18,58,84,0.82)")
    ].join(";");
    if (chrome.inset) style += ";--sm-inset:" + chrome.inset;
    if (chrome.coverMinHeight) style += ";--sm-cover-min:" + chrome.coverMinHeight;
    var html = "";
    var firstIsIntro = rows[0] && rows[0].ids && byId[rows[0].ids[0]] && byId[rows[0].ids[0]].kind === "introduction";
    rows.forEach(function (row, idx) {
      var ids = row.ids || [];
      var stacked = ids.length > 1;
      var full = row.fullBleed;
      var cls = "row" + (full ? " full-bleed" : " inset") + (stacked ? " stacked" : "") +
        (idx === 1 && firstIsIntro ? " after-intro" : "");
      var inner = ids.map(function (id) {
        var block = byId[id];
        if (!block) return "";
        if (block.kind === "credits" && chrome.showCredits === false) return "";
        if (block.kind === "introduction") return coverHtml(block, chrome);
        return '<div class="cell">' + blockInner(block, board, stacked) + "</div>";
      }).join("");
      html += '<div class="' + cls + '">' + inner + "</div>";
    });
    root.innerHTML = '<div class="viewport" style="' + style + '"><article class="story">' + html +
      '<p class="attrib">© OpenStreetMap © CARTO © Esri · Snapshot, not live Spatial Intelligence</p></article></div>';
    Array.prototype.forEach.call(root.querySelectorAll(".sm-map"), function (el) {
      var mapId = el.getAttribute("data-map-id");
      var cam = null;
      try { cam = JSON.parse(el.getAttribute("data-camera") || "null"); } catch (e) {}
      var mb = ((board.maps || []).find(function (m) { return m.id === mapId; }) || {});
      mountMap(el, {
        basemap: mb.basemap || "positron",
        showLabels: board.showMapLabels,
        overlays: overlaysForMap(board, mapId),
        center: cam && cam.center,
        zoom: cam && cam.zoom,
        fit: !(cam && cam.center)
      });
    });
  }
  var root = document.getElementById("app");
  if (!root) return;
  if (pub.kind === "map") renderMapPage(root, pub.map || {});
  else renderStory(root, pub.storymap || {});
})();</script>
